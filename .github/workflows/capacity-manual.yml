{
  "name": "Manual synthetic ingestion capacity 10K",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "correlation": {
          "description": "Unique UUID supplied by reviewed caller; not a scale selector",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "capacity-manual-${{ github.repository }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "capacity-10k": {
      "if": "${{ github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 40,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "control",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "candidate",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "22.x",
            "package-manager-cache": false
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Verify exact event checkouts and correlation before bootstrap",
          "shell": "bash --noprofile --norc -euo pipefail {0}",
          "run": "python3 -B control/.github/scripts/capacity-ci.py --candidate \"$GITHUB_WORKSPACE/candidate\" --event-sha \"$GITHUB_SHA\" --identity-only"
        },
        {
          "name": "Bootstrap pinned ARM dependencies",
          "id": "bootstrap",
          "continue-on-error": true,
          "timeout-minutes": 6,
          "shell": "bash --noprofile --norc -euo pipefail {0}",
          "run": "umask 077\npython3 -B control/.github/scripts/capacity-ci.py --candidate \"$GITHUB_WORKSPACE/candidate\" --event-sha \"$GITHUB_SHA\" --bootstrap-only --authorized-disposable-runner > \"$RUNNER_TEMP/vexa-capacity-bootstrap.log\" 2>&1"
        },
        {
          "name": "One 10K measurement and bounded evidence",
          "if": "${{ always() }}",
          "shell": "bash --noprofile --norc -euo pipefail {0}",
          "run": "python3 -B control/.github/scripts/capacity-ci.py --candidate \"$GITHUB_WORKSPACE/candidate\" --event-sha \"$GITHUB_SHA\" --bootstrap-outcome \"${{ steps.bootstrap.outcome }}\""
        }
      ],
      "env": {
        "CAPACITY_CORRELATION": "${{ inputs.correlation }}"
      }
    }
  },
  "run-name": "Capacity 10K \u00b7 ${{ inputs.correlation }}"
}
