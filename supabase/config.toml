# VEXA-only local development. Synthetic data; never link/reset another project.
project_id = "vexa-local"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 56329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"
openai_api_key = ""

[local_smtp]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3640"
additional_redirect_urls = ["http://localhost:3640/auth/callback", "http://127.0.0.1:3640/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false

# Enabled only after a dedicated Google OAuth client is supplied/configured.
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[analytics]
enabled = false
port = 56327
backend = "postgres"

[edge_runtime]
enabled = false
