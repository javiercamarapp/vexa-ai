# VEXA-only local development. Synthetic data; never link/reset another project.
project_id = "vexa-local"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 56329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"
openai_api_key = ""

[local_smtp]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3640"
additional_redirect_urls = ["http://localhost:3640/auth/callback", "http://127.0.0.1:3640/auth/callback", "http://localhost:3640/auth/email/complete", "http://127.0.0.1:3640/auth/email/complete", "http://localhost:3640/auth/invitations/*", "http://127.0.0.1:3640/auth/invitations/*"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false
# Vigencia de enlaces y códigos (segundos). Los textos de los correos dicen «1 hora»: si cambia, cambiar VIGENCIA en email-system.mjs.
otp_expiry = 3600

# Enabled only after a dedicated Google OAuth client is supplied/configured.
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[analytics]
enabled = false
port = 56327
backend = "postgres"

[edge_runtime]
enabled = false
[auth.email.template.magic_link]
subject = "Tu enlace para entrar a Rovaq"
content_path = "./supabase/templates/auth/magic_link.html"

[auth.email.template.reauthentication]
subject = "Tu código de verificación de Rovaq"
content_path = "./supabase/templates/auth/reauthentication.html"

[auth.email.template.confirmation]
subject = "Confirma tu correo en Rovaq"
content_path = "./supabase/templates/auth/confirmation.html"

[auth.email.template.recovery]
subject = "Restablece el acceso a Rovaq"
content_path = "./supabase/templates/auth/recovery.html"

[auth.email.template.email_change]
subject = "Confirma tu nuevo correo en Rovaq"
content_path = "./supabase/templates/auth/email_change.html"

[auth.email.template.invite]
subject = "Te invitaron a un espacio en Rovaq"
content_path = "./supabase/templates/auth/invite.html"

[auth.email.notification.password_changed]
enabled = true
subject = "La contraseña de tu cuenta cambió"
content_path = "./supabase/templates/auth/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "El correo de tu cuenta cambió"
content_path = "./supabase/templates/auth/email_changed_notification.html"

[auth.email.notification.phone_changed]
enabled = true
subject = "El teléfono de tu cuenta cambió"
content_path = "./supabase/templates/auth/phone_changed_notification.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "Se vinculó un método de acceso"
content_path = "./supabase/templates/auth/identity_linked_notification.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "Se desvinculó un método de acceso"
content_path = "./supabase/templates/auth/identity_unlinked_notification.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "Se agregó una verificación en dos pasos"
content_path = "./supabase/templates/auth/mfa_factor_enrolled_notification.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "Se quitó una verificación en dos pasos"
content_path = "./supabase/templates/auth/mfa_factor_unenrolled_notification.html"
